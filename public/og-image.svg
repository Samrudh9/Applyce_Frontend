<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, Helvetica, Arial, sans-serif">
  <!-- Flat orange canvas — no gradient washes -->
  <rect width="1200" height="630" fill="#FF5722"/>

  <!-- subtle bottom depth band (flat, opaque) -->
  <rect width="1200" height="630" fill="#C9372C" opacity="0.06"/>

  <!-- mark tile (176x176, centered) -->
  <g transform="translate(512,92)">
    <rect width="176" height="176" rx="44" fill="#ffffff"/>
    <g fill="#FF5722">
      <rect x="44" y="110" width="22" height="44" rx="6"/>
      <rect x="77" y="82" width="22" height="72" rx="6"/>
      <rect x="110" y="55" width="22" height="99" rx="6"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="600" y="428" text-anchor="middle" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-2">Applyce</text>

  <!-- tagline -->
  <text x="600" y="494" text-anchor="middle" font-size="32" font-weight="400" fill="#ffffff" opacity="0.92" letter-spacing="0">AI career guidance — find your path</text>
</svg>