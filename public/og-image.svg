<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1a1f2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#002fa7"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle radial glow -->
  <circle cx="960" cy="150" r="380" fill="#002fa7" opacity="0.25"/>
  <circle cx="120" cy="560" r="320" fill="#34d399" opacity="0.12"/>

  <!-- brand mark tile -->
  <g transform="translate(100, 190)">
    <rect width="88" height="88" rx="22" fill="#34d399"/>
    <path d="M44 22 L18 70 L32 70 L39 55 L49 55 L56 70 L70 70 Z" fill="#0b1020"/>
    <line x1="47" y1="28" x2="38" y2="70" stroke="#0b1020" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="100" y="400" font-family="Inter, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#ffffff" letter-spacing="-1">Applyce</text>

  <!-- tagline -->
  <text x="100" y="460" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#c8cedd" letter-spacing="0">AI career recommendation, ATS scoring &amp; skill-gap analytics</text>
</svg>
