<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary meta -->
  <title>Applyce — AI career tools, from resume to offer</title>
  <meta name="description" content="Applyce is a set of free AI career tools. Upload a resume for a career match, ATS score, salary estimate, and skill gaps — then build, track, and apply." />

  <!-- Icons & browser chrome -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="mask-icon" href="/mask-icon.svg" color="#FF5722" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#FF5722" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Canonical -->
  <link rel="canonical" href="https://applyce.tech/" />

  <!-- Open Graph -->
  <meta property="og:site_name" content="Applyce" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Applyce — AI career tools, from resume to offer" />
  <meta property="og:description" content="Applyce is a set of free AI career tools. Upload a resume for a career match, ATS score, salary estimate, and skill gaps — then build, track, and apply." />
  <meta property="og:url" content="https://applyce.tech/" />
  <meta property="og:image" content="https://applyce.tech/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Applyce — AI career tools, from resume to offer." />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Applyce — AI career tools, from resume to offer" />
  <meta name="twitter:description" content="Applyce is a set of free AI career tools. Upload a resume for a career match, ATS score, salary estimate, and skill gaps — then build, track, and apply." />
  <meta name="twitter:image" content="https://applyce.tech/og-image.png" />

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://applyce.tech/#organization",
        "name": "Applyce",
        "url": "https://applyce.tech/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://applyce.tech/og-image.png"
        },
        "sameAs": []
      },
      {
        "@type": "WebSite",
        "@id": "https://applyce.tech/#website",
        "url": "https://applyce.tech/",
        "name": "Applyce",
        "publisher": { "@id": "https://applyce.tech/#organization" },
        "inLanguage": "en"
      },
      {
        "@type": "SoftwareApplication",
        "@id": "https://applyce.tech/#app",
        "name": "Applyce",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://applyce.tech/",
        "description": "Upload a resume for a career match, ATS score, salary estimate, and skill gaps — plus a career roadmap to close them.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR"
        },
        "publisher": { "@id": "https://applyce.tech/#organization" }
      }
    ]
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
